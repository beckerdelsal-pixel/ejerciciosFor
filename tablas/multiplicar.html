<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tablas de Multiplicar</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js" defer></script>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">
            <header class="encabezado-tarjeta">
                <h1>Tabla de Multiplicar</h1>
                <p class="subtitulo">Ingresa cualquier número para aprender y consultar su tabla al instante.</p>
            </header>

            <form class="formulario-multiplicar" onsubmit="event.preventDefault(); generarTablas();">
                <div class="campo-texto">
                    <label for="txtNumero">¿Qué tabla deseas ver?</label>
                    <div class="grupo-input">
                        <input 
                            type="number" 
                            id="txtNumero" 
                            name="txtNumero" 
                            placeholder="Ej. 5" 
                            min="1" 
                            max="999" 
                            inputmode="numeric" 
                            required 
                            autocomplete="off"
                        >
                        <button type="submit" class="btn-generar" id="btnGenerar">
                            Mostrar Tabla
                        </button>
                    </div>
                    <span class="mensaje-ayuda" id="mensajeAyuda">Escribe un número del 1 al 999.</span>
                </div>
            </form>

            <div class="contenedor-tabla" aria-live="polite">
                <table id="tablaResultados">
                    <thead>
                        <tr>
                            <th>Multiplicación</th>
                            <th>Resultado</th>
                        </tr>
                    </thead>
                    <tbody id="contenedorTabla">
                        <tr>
                            <td colspan="2" class="estado-vacio">
                                💡 Ingresa un número arriba y presiona <strong>"Mostrar Tabla"</strong>.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <footer class="pie-pagina">
        <div class="perfil-autor">
            <img src="avatar.png" alt="Foto de perfil del desarrollador" class="avatar">
            <div class="informacion-autor">
                <span class="etiqueta-autor">DESARROLLADOR</span>
                <span class="nickname">Becktorke</span>
            </div>
        </div>
    </footer>

</body>

</html>
