<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js"></script>
</head>

<body>

    <main class="contenedor">

        <button class="btn-probar" onclick="generarTablas();">PROBAR</button>

        <section class="tarjeta">
            <h1>Tabla de Multiplicar</h1>

            <table>
                <thead>
                    <tr>
                        <th>Operación</th>
                        <th>Resultado</th>
                    </tr>
                </thead>

                <tbody id="contenedorTabla">//contenedor
                    <tr>//item
                        <td>1 × 1</td>
                        <td>1</td>
                    </tr>
                    <tr>//item
                        <td>1 × 2</td>
                        <td>2</td>
                    </tr>
                    <tr>//item
                        <td>1 × 3</td>
                        <td>3</td>
                    </tr>
                    <tr>//item
                        <td>1 × 4</td>
                        <td>4</td>
                    </tr>
                    <tr>//item
                        <td>1 × 5</td>
                        <td>25</td>
                    </tr>
                    <tr>//item
                        <td>1 × 6</td>
                        <td>6</td>
                    </tr>
                    <tr>//item
                        <td>1 × 7</td>
                        <td>7</td>
                    </tr>
                    <tr>//item
                        <td>1 × 8</td>
                        <td>8</td>
                    </tr>
                    <tr>//item
                        <td>1 × 9</td>
                        <td>9</td>
                    </tr>
                    <tr>//item
                        <td>1 × 10</td>
                        <td>10</td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>
    <footer class="pie-pagina">

        <div class="perfil-autor">

            <img src="avatar.png" alt="Avatar de Becktorke" class="avatar">

            <div class="informacion-autor">
                <span class="etiqueta-autor">DESARROLLADOR</span>
                <span class="nickname">Becktorke</span>
            </div>

        </div>

    </footer>
</body>

</html>
